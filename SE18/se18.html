<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo Flexbox</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="menu">
        <a href="#">Início</a>
        <a href="#">Sobre</a>
        <a href="#">Serviços</a>
        <a href="#">Contato</a>
    </header>

    <main class="conteudo">
        <div class="card">Card 1</div>
        <div class="card">Card 2</div>
        <div class="card">Card 3</div>
    </main>


    <section class="depoimentos">
        <div class="box-depoimento">
            <img src="" alt="Pessoa 1">
            <h3>João Silva</h3>
            <p>"Ótimo serviço, super recomendo a todos."</p>
        </div>
        <div class="box-depoimento">
            <img src="" alt="Pessoa 2">
            <h3>Maria Souza</h3>
            <p>"Equipe atenciosa e entrega rápida."</p>
        </div>
        <div class="box-depoimento">
            <img src="" alt="Pessoa 3">
            <h3>Carlos Pereira</h3>
            <p>"Experiência excelente do começo ao fim."</p>
        </div>
    </section>

</body>

</html>
