<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Grid com Áreas Nomeadas</title>
  <style>
    .container {
      display: grid;
      grid-template-areas:
        "header header"
        "menu content"
        "footer footer";
      grid-template-columns: 1fr 3fr;
      grid-template-rows: auto 1fr auto;
      gap: 10px;
      height: 98vh;
      padding: 10px;
      background-color: #f0f0f0;
      box-sizing: border-box;
    }

    .header  { grid-area: header; background-color: #3498db; }
    .menu    { grid-area: menu; background-color: #2ecc71; }
    .content { grid-area: content; background-color: #e67e22; }
    .footer  { grid-area: footer; background-color: #9b59b6; }

    .padrao {
      color: white;
      padding: 20px;
      font-size: 18px;
      border-radius: 6px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header padrao">Cabeçalho</div>
    <div class="menu padrao">Menu</div>
    <div class="content padrao">Conteúdo Principal</div>
    <div class="footer padrao">Rodapé</div>
  </div>

</body>
</html>
