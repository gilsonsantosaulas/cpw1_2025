<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Formulário de Matrícula</title>
    <style>
        .input-300 {
            margin-bottom: 10px;
            display: block;
            width: 300px;
        }
        
        .form-centralizado-300 {
            width: 300px;
            margin: auto;
        }

    </style>
</head>

<body>

        <form class="form-centralizado-300">
            <label>Nome completo:</label>
            <input type="text" class="input-300">

            <label>Curso:</label>
            <input type="text" class="input-300">

            <label>Disciplina:</label>
            <input type="text" class="input-300">

            <button>Matricular</button>
        </form>

</body>

</html>
