<!DOCTYPE html>
<html>

<head>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <form>
    <h1>Formulário D</h1>
    <label for="nome">Nome:</label>
    <input type="text" id="nome">

    <div class="em-linha">
      <h4>Gênero:</h4>
      <input type="radio" name="genero"> <label>Masculino</label>
      <input type="radio" name="genero"> <label>Feminino</label>
      <input type="radio" name="genero"> <label>Outro</label>
    </div>

    <div class="em-linha">
      <h4>Dias disponíveis:</h4>
      <input type="checkbox" name="dias" id="dias1"> <label for="dias1">Segunda</label> 

      <input type="checkbox" name="dias" id="dias2"> <label for="dias2">Quarta</label> 

      <input type="checkbox" name="dias" id="dias3"> <label for="dias3">Sexta</label>
      
    </div>

    <button>Confirmar Inscrição</button>
  </form>
</body>

</html>
