<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Rodapé com Botões</title>
  <style>
    body {
      margin: 0;
    }

    .div-inferior {
      height: 200px;
      background-color: #dcdcdc;
      display: flex;
      justify-content: flex-end; /* alinhar a direita na horizontal */
      align-items: flex-end;     /* Inferior na vertical */
      padding: 20px;
    }

    .div-inferior button { /* button dentro de elemento com a classe div-inferior */
      margin: 10px;
      padding: 10px 15px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="div-inferior">
    <button>Salvar</button>
    <button>Editar</button>
    <button>Excluir</button>
  </div>
</body>
</html>
